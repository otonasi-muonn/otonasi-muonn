<svg xmlns="http://www.w3.org/2000/svg" width="720" height="280" viewBox="0 0 720 280">
<title>CSS computation: square a changing number</title>
<desc>Pure SVG and CSS compute n squared and display the decimal digits. No JavaScript, no HTML foreignObject, no network.</desc>
<style><![CDATA[
@property --n { syntax:"<integer>"; inherits:true; initial-value:0; }
@property --digit { syntax:"<integer>"; inherits:true; initial-value:0; }
@keyframes clock { from { --n:0 } to { --n:9 } }
#engine { --square:calc(var(--n)*var(--n)); --tens:round(down,var(--square)/10,1); --ones:mod(var(--square),10); animation:clock 9s steps(9,start) infinite; }
#input {--digit:var(--n)}
#tens {--digit:var(--tens)}
#ones {--digit:var(--ones)}
.segment {fill:#5df0ae;opacity:0.07;}
.seg-a {opacity:if(style(--digit:0):1;style(--digit:2):1;style(--digit:3):1;style(--digit:5):1;style(--digit:6):1;style(--digit:7):1;style(--digit:8):1;style(--digit:9):1;else:0.07)}
.seg-b {opacity:if(style(--digit:0):1;style(--digit:1):1;style(--digit:2):1;style(--digit:3):1;style(--digit:4):1;style(--digit:7):1;style(--digit:8):1;style(--digit:9):1;else:0.07)}
.seg-c {opacity:if(style(--digit:0):1;style(--digit:1):1;style(--digit:3):1;style(--digit:4):1;style(--digit:5):1;style(--digit:6):1;style(--digit:7):1;style(--digit:8):1;style(--digit:9):1;else:0.07)}
.seg-d {opacity:if(style(--digit:0):1;style(--digit:2):1;style(--digit:3):1;style(--digit:5):1;style(--digit:6):1;style(--digit:8):1;style(--digit:9):1;else:0.07)}
.seg-e {opacity:if(style(--digit:0):1;style(--digit:2):1;style(--digit:6):1;style(--digit:8):1;else:0.07)}
.seg-f {opacity:if(style(--digit:0):1;style(--digit:4):1;style(--digit:5):1;style(--digit:6):1;style(--digit:8):1;style(--digit:9):1;else:0.07)}
.seg-g {opacity:if(style(--digit:2):1;style(--digit:3):1;style(--digit:4):1;style(--digit:5):1;style(--digit:6):1;style(--digit:8):1;style(--digit:9):1;else:0.07)}
#fallback {display:block;}
@supports (opacity: if(style(--digit:0):1; else:0)) {#fallback {display:none;}}
]]></style>
<rect width="720" height="280" rx="16" fill="#152435"/>
<text x="35" y="40" fill="#9ac8d1" font-size="16" font-family="monospace">otonasi-muonn / CSS computes without JavaScript</text>
<g id="engine">
<g id="input" transform="translate(56,69)">
  <rect class="segment seg-a" x="14" y="0" width="74" height="12" rx="5"/>
  <rect class="segment seg-b" x="88" y="12" width="12" height="68" rx="5"/>
  <rect class="segment seg-c" x="88" y="86" width="12" height="68" rx="5"/>
  <rect class="segment seg-d" x="14" y="154" width="74" height="12" rx="5"/>
  <rect class="segment seg-e" x="2" y="86" width="12" height="68" rx="5"/>
  <rect class="segment seg-f" x="2" y="12" width="12" height="68" rx="5"/>
  <rect class="segment seg-g" x="14" y="77" width="74" height="12" rx="5"/>
</g>
<text x="212" y="170" fill="#ecf7fa" font-size="47" font-family="monospace">² =</text>
<g id="tens" transform="translate(402,69)">
  <rect class="segment seg-a" x="14" y="0" width="74" height="12" rx="5"/>
  <rect class="segment seg-b" x="88" y="12" width="12" height="68" rx="5"/>
  <rect class="segment seg-c" x="88" y="86" width="12" height="68" rx="5"/>
  <rect class="segment seg-d" x="14" y="154" width="74" height="12" rx="5"/>
  <rect class="segment seg-e" x="2" y="86" width="12" height="68" rx="5"/>
  <rect class="segment seg-f" x="2" y="12" width="12" height="68" rx="5"/>
  <rect class="segment seg-g" x="14" y="77" width="74" height="12" rx="5"/>
</g>
<g id="ones" transform="translate(550,69)">
  <rect class="segment seg-a" x="14" y="0" width="74" height="12" rx="5"/>
  <rect class="segment seg-b" x="88" y="12" width="12" height="68" rx="5"/>
  <rect class="segment seg-c" x="88" y="86" width="12" height="68" rx="5"/>
  <rect class="segment seg-d" x="14" y="154" width="74" height="12" rx="5"/>
  <rect class="segment seg-e" x="2" y="86" width="12" height="68" rx="5"/>
  <rect class="segment seg-f" x="2" y="12" width="12" height="68" rx="5"/>
  <rect class="segment seg-g" x="14" y="77" width="74" height="12" rx="5"/>
</g>
</g>
<text id="fallback" x="230" y="194" fill="#ffffff" font-size="17" font-family="monospace">Advanced CSS unavailable: static fallback</text>
<text x="38" y="261" fill="#92a7bc" font-size="14" font-family="monospace">n²: CSS calc(), mod(), round(), if() | 0-9, repeat</text>
</svg>